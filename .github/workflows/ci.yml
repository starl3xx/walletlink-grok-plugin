name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate manifests and smoke-test the live server
        env:
          WALLETLINK_API_KEY: ${{ secrets.WALLETLINK_API_KEY }}
        run: bash scripts/smoke.sh
